<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/display/manifest.json" />
    <link rel="icon" href="/display/icon.svg" />
    <link rel="stylesheet" href="/display/style.css" />
    <title>Lyricsflow</title>
  </head>
  <body class="black">
    <main id="scene">
      <div class="art" id="art-a"></div>
      <div class="art" id="art-b"></div>
      <div class="shade"></div>
      <header>
        <div id="title"></div>
        <div id="artist"></div>
      </header>
      <div class="pause-indicator" aria-label="Paused">
        <span></span><span></span>
      </div>
      <section class="artwork-view" aria-live="off">
        <img id="cover" alt="" />
        <div class="cover-title" id="cover-title"></div>
        <div class="cover-artist" id="cover-artist"></div>
        <div class="cover-album" id="cover-album"></div>
      </section>
      <section class="lyrics" aria-live="off">
        <div class="line previous"></div>
        <div class="line current"></div>
        <div class="line next"></div>
      </section>
    </main>
    <nav id="controls" aria-label="Music controls">
      <button data-command="PREVIOUS" aria-label="Previous">
        <svg viewBox="0 0 32 32">
          <path d="M5 5h3v22H5zm4 11L28 5v22z" />
        </svg></button
      ><button id="play" data-command="PLAY_PAUSE" aria-label="Play">
        <svg viewBox="0 0 32 32"><path d="M10 5v22l18-11z" /></svg></button
      ><button data-command="NEXT" aria-label="Next">
        <svg viewBox="0 0 32 32"><path d="M24 5h3v22h-3zM4 5v22l19-11z" /></svg>
      </button>
    </nav>
    <script src="/display/app.js"></script>
  </body>
</html>
